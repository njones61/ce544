<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" width="660" height="460" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#1d2733">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/>
    </marker>
  </defs>
  <rect width="660" height="460" fill="#ffffff"/>
  <!-- the river -->
  <path d="M5,72 C90,62 170,86 260,80 C350,74 420,84 500,92 C530,96 540,118 560,112 C590,104 600,86 655,84
           L655,102 C600,104 592,124 560,130 C530,136 520,110 500,108 C420,102 350,94 260,98 C170,104 90,80 5,90 Z"
        fill="#8EC5F2" stroke="#2F6FB5" stroke-width="1.5"/>
  <text x="300" y="22" text-anchor="middle" font-weight="bold">Rio Grande River</text>
  <text x="300" y="44" text-anchor="middle">Ave Stage = 5352 ft</text>
  <!-- the french drain -->
  <rect x="85" y="284" width="440" height="9" fill="#C9C1DE" stroke="#5B5687"/>
  <text x="510" y="166" text-anchor="middle">French Drain</text>
  <text x="510" y="188" text-anchor="middle">Top = 5358 ft</text>
  <text x="510" y="210" text-anchor="middle">Depth = 21 ft</text>
  <line x1="470" y1="216" x2="405" y2="282" stroke="#1d2733" stroke-width="1.2" marker-end="url(#ah)"/>
  <!-- distance from the river -->
  <line x1="293" y1="92" x2="293" y2="282" stroke="#1d2733" stroke-width="1.2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="0" y="0" transform="translate(300,187) rotate(90)" text-anchor="middle">280 ft</text>
  <!-- length -->
  <line x1="87" y1="310" x2="523" y2="310" stroke="#1d2733" stroke-width="1.2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <rect x="270" y="300" width="70" height="20" fill="#ffffff"/>
  <text x="305" y="316" text-anchor="middle">500 ft</text>
  <text x="80" y="192">K = 14 ft/day</text>
  <!-- the excavation -->
  <path d="M205,342 H262 V372 H376 V448 H205 Z" fill="#EEF2E6" stroke="#2B4C6F" stroke-width="1.5"/>
  <text x="110" y="390" text-anchor="middle">Planned</text>
  <text x="110" y="412" text-anchor="middle">Excavation</text>
  <path d="M150,378 C170,366 186,368 200,378" fill="none" stroke="#1d2733" stroke-width="1.2" marker-end="url(#ah)"/>
</svg>
